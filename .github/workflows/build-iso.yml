name: Build Light Lite System ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Compilar ISO com Docker (Arch Linux Oficial)
       run: |
  mkdir -p out
  docker run --privileged --rm \
    -v ${{ github.workspace }}:/build \
    -v ${{ github.workspace }}/out:/out \
    archlinux:latest bash -c "
      pacman -Syu --noconfirm &&
      pacman -S --noconfirm archiso &&
      cp -r /usr/share/archiso/configs/releng/efiboot /usr/share/archiso/configs/releng/syslinux /build/ &&
      grep -qxF 'syslinux' /build/packages.x86_64 || echo 'syslinux' >> /build/packages.x86_64 &&
      mkarchiso -v -w /tmp/archiso-work -o /out /build
    "
            "

      - name: Gerar Checksum SHA256
        run: |
          cd out
          sha256sum *.iso > SHA256SUMS.txt
          ls -lh

      - name: Fazer Upload do Artefato da ISO
        uses: actions/upload-artifact@v4
        with:
          name: Light_Lite_System_ISO
          path: out/*
          retention-days: 7

      - name: Criar Release no GitHub (Opcional se tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
